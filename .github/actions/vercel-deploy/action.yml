# One Vercel project to production, then checked that it answers. Used by
# .github/workflows/deploy-app.yml once the check has passed. Needs
# VERCEL_TOKEN (and VERCEL_SCOPE, for a team) in the job's environment.
name: Deploy to Vercel
description: Deploys one project to production, checks it answers, and marks the commit as deployed (refs/deployed/<project>).
inputs:
  project:
    description: The Vercel project's name
    required: true
  side:
    description: backend (its /health is checked) or frontend (its sign-in page)
    required: true
runs:
  using: composite
  steps:
    - name: Deploy ${{ inputs.project }}
      # bash -eo pipefail: a failed deploy fails the step, so it isn't marked as deployed.
      shell: bash
      run: |
        scope="${VERCEL_SCOPE:-$(python3 -c 'import json; print(json.load(open(".github/deploy.json")).get("scope", ""))')}"
        flags=()
        [ -n "$scope" ] && flags=(--scope "$scope")
        # From the repo's root: the project's Root Directory (on Vercel) says which folder it builds.
        npx --yes vercel@latest link --yes --project "${{ inputs.project }}" "${flags[@]}" --token "$VERCEL_TOKEN"
        npx --yes vercel@latest deploy --prod --yes "${flags[@]}" --token "$VERCEL_TOKEN" | tee deploy.log
        echo "Deployed ${{ inputs.project }}: $(tail -n 1 deploy.log)" >> "$GITHUB_STEP_SUMMARY"

    - name: Is it answering?
      shell: bash
      run: python3 scripts/deploy/vercel_check.py health --project "${{ inputs.project }}" --side "${{ inputs.side }}"

    # Kept as refs/deployed/<project>, not a tag: a tag that moves clashes with
    # everyone's copy on their next pull. See what's live with
    # git ls-remote origin "refs/deployed/*". The old tag of the same name goes.
    - name: Remember this commit as deployed
      shell: bash
      run: |
        git push -f origin "HEAD:refs/deployed/${{ inputs.project }}"
        git push origin ":refs/tags/deployed/${{ inputs.project }}" 2>/dev/null || true
