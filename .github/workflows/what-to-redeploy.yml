# Says which apps need redeploying, and deploys nothing (decided 2026-10-27):
# deployment stays by hand, so Vercel's deployments are only spent on what changed.
#
# The run's summary:
#   Changed in this push  the apps the pushed commits changed
#   Behind on Vercel      the apps whose live production deployment is older than
#                         their code here: by the commit it was built from when
#                         Vercel knows it, else by when it was deployed
#   Up to date            the rest
# Tests, README files and the command-line tools (app/tools/) don't count: they
# aren't part of what runs online.
#
# Needs, in GitHub (Settings -> Secrets and variables -> Actions):
#   secret   VERCEL_TOKEN    a Vercel token (vercel.com/account/settings/tokens)
#   variable VERCEL_TEAM_ID  only if the projects are in a Vercel team (team_...)
# Without the token, only the first list is shown.
name: What to redeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List what to redeploy
        env:
          TZ: Asia/Manila
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        shell: python
        run: |
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone

          # In the order they're deployed: the Platform, then the APIs, then the one app.
          APPS = [
              ("Platform", "bishnoi-platform/backend", "bishnoione-platform-backend"),
              ("CRM", "bishnoi-crm/backend", "bishnoione-crm-backend"),
              ("Inventory", "bishnoi-inventory/backend", "bishnoione-inventory-backend"),
              ("Finance", "bishnoi-finance/backend", "bishnoione-finance-backend"),
              ("Executive Admin", "bishnoi-admin/backend", None),
              ("Pharmacy", "bishnoi-pharmacy/backend", None),
              ("In-Licensing", "bishnoi-in-licensing/backend", None),
              ("Regulatory", "bishnoi-regulatory/backend", None),
              ("One app (screens)", "bishnoi-one-app/frontend", "bishnoi-one-app"),
          ]
          SKIP = [":(exclude)*/tests/*", ":(exclude)*/app/tools/*", ":(exclude)*.md", ":(exclude)*/.env.example"]

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout.strip()

          def when(seconds):
              return datetime.fromtimestamp(seconds).strftime("%Y-%m-%d %H:%M")

          def changes(folder, since=None, after=None):
              """What changed in the code that runs online, after a commit or a moment; None if nothing."""
              since_time = [f"--since={datetime.fromtimestamp(after, timezone.utc):%Y-%m-%dT%H:%M:%SZ}"] if after else []
              span = [f"{since}..HEAD"] if since else ["HEAD"]
              rows = [l.split("|", 2) for l in git("log", "--format=%H|%ct|%an", *since_time, *span, "--", folder, *SKIP).splitlines() if l]
              if not rows:
                  return None
              files = git("diff", "--name-only", since or f"{rows[-1][0]}^", "HEAD", "--", folder, *SKIP).splitlines()
              authors = list(dict.fromkeys(name for _, _, name in rows))
              return {"latest": rows[0][0][:7], "last": when(int(rows[0][1])), "commits": len(rows), "files": len(files), "authors": ", ".join(authors)}

          def table(header, rows):
              lines = ["| " + " | ".join(header) + " |", "|" + "|".join(" --- " for _ in header) + "|"]
              return lines + ["| " + " | ".join(r) + " |" for r in rows]

          out = ["## What to redeploy", ""]
          action = "Pushed" if os.environ["EVENT"] == "push" else "Run"
          out += [f"{action} by **{os.environ['ACTOR']}** on {datetime.now():%Y-%m-%d %H:%M} (Manila time)", ""]
          out += [f"Commit `{git('rev-parse', '--short', 'HEAD')}`: {git('log', '-1', '--format=%s')[:100]}", ""]

          # --- changed in this push ---
          before = os.environ.get("BEFORE") or ""
          if not before.strip("0") or not git("cat-file", "-t", before):
              before = git("rev-parse", "HEAD~1")
          pushed = [(name, project, c) for name, folder, project in APPS if (c := changes(folder, since=before))]
          out += ["### Changed in this push", ""]
          if pushed:
              out += table(["App", "Vercel project", "Commits", "Files"], [[f"**{n}**", f"`{p}`" if p else "_not on Vercel_", str(c["commits"]), str(c["files"])] for n, p, c in pushed])
          else:
              out.append("No app changed.")
          out.append("")

          # --- compared with what's live on Vercel ---
          token, team = os.environ.get("VERCEL_TOKEN"), os.environ.get("VERCEL_TEAM_ID")

          def vercel(path):
              url = f"https://api.vercel.com{path}" + (f"{'&' if '?' in path else '?'}teamId={team}" if team else "")
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"}), timeout=20) as r:
                      return json.load(r)
              except Exception as e:
                  return {"error": str(e)}

          def commit_of(d):
              """The commit a deployment was built from, when Vercel was told (Git link, or the CLI in a checkout)."""
              for k, v in (d.get("meta") or {}).items():
                  if k.lower().endswith("commitsha") and v:
                      return v
              return (d.get("gitSource") or {}).get("sha")

          def live_deployment(project_id, target):
              """What production serves now (after a rollback too), else the newest ready production deployment."""
              d = vercel(f"/v13/deployments/{target}") if target else {}
              if "id" in d:
                  return d
              found = vercel(f"/v6/deployments?projectId={project_id}&target=production&state=READY&limit=1").get("deployments") or []
              return found[0] if found else None

          if not token:
              out += ["### Compared with Vercel", "", "> Add the `VERCEL_TOKEN` secret to compare with what's live (see the top of this workflow).", ""]
          else:
              behind, current, problems, by_date = [], [], [], False
              for name, folder, project in APPS:
                  if not project:
                      continue
                  info = vercel(f"/v9/projects/{project}")
                  if "id" not in info:
                      word = folder.split("/")[0].removeprefix("bishnoi-").split("-")[0]
                      near = [p.get("name", "") for p in (vercel("/v9/projects?limit=100").get("projects") or []) if word in p.get("name", "")]
                      problems.append(f"- **{name}**: no Vercel project named `{project}`." + (f" Similar: {', '.join(f'`{n}`' for n in near)}." if near else ""))
                      continue
                  d = live_deployment(info["id"], ((info.get("targets") or {}).get("production") or {}).get("id"))
                  if not d:
                      problems.append(f"- **{name}**: `{project}` has no production deployment yet.")
                      continue
                  deployed = int((d.get("created") or d.get("createdAt")) / 1000)
                  sha = commit_of(d)
                  exact = bool(sha and git("cat-file", "-t", sha))
                  c = changes(folder, since=sha) if exact else changes(folder, after=deployed)
                  live = f"`{sha[:7]}`" if exact else f"{when(deployed)} ¹"
                  by_date = by_date or not exact
                  if c:
                      behind.append([f"**{name}**", f"`{project}`", live, f"`{c['latest']}`", str(c["commits"]), c["last"], c["authors"]])
                  else:
                      current.append(f"- **{name}**: {live}")

              out += [f"### Behind on Vercel ({len(behind)})", ""]
              if behind:
                  out += table(["App", "Vercel project", "Live", "Latest here", "Commits behind", "Last change", "By"], behind)
                  out += ["", "Redeploy them in the order listed: the Platform first, then the APIs, then the one app."]
              else:
                  out.append("Nothing: everything on Vercel is up to date.")
              out.append("")
              if current:
                  out += [f"### Up to date ({len(current)})", "", *current, ""]
              if problems:
                  out += ["### Needs a look", "", *problems, ""]
              if by_date:
                  out += ["> ¹ Vercel doesn't know which commit this was built from, so it's compared by when it was deployed.", ""]

          text = "\n".join(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text + "\n")
          print(text)
