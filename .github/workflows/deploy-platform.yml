# Puts Platform on Vercel, only when you ask: Actions > Deploy Platform > Run workflow.
# When: first: every other app checks companies and Bishnoi One sign-ins there.
#
# It checks first that everything is set up (the Vercel token, Platform's Vercel
# projects, their settings, the apps it needs online) and stops with what to do
# next when something isn't; then tests, deploys the API and then the screens,
# and checks each answers. The steps are in deploy-app.yml; what Platform needs is
# under "apps" in .github/deploy.json.
name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      part:
        description: "What to deploy"
        type: choice
        options:
          - screens and API
          - API only
          - screens only
        default: screens and API
      run_tests:
        description: "Run the API's tests first (a failure stops the deploy)"
        type: boolean
        default: true

# One deploy of Platform at a time; a second run waits for the first.
concurrency:
  group: deploy-platform
  cancel-in-progress: false

permissions:
  contents: write # the deployed/<project> tags

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-platform
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit
