# Keeps main and the per-app branches in step, on GitHub, after every push.
#
# - A push to main rebuilds every app's branch from its folder.
# - A push to an app branch (orbit-sales, orbit-admin, ...) merges that work into
#   main's folder first, then rebuilds the branches.
#
# It runs scripts/sync-branches.sh, the same script you can still run by hand.
# Its own pushes use the workflow's token, and GitHub doesn't start workflows
# from those, so it never triggers itself.
#
# GitHub reads a push's workflow from the branch pushed to, and an app branch
# holds only its folder. So this same file is also in each app folder
# (orbit-*/.github/workflows/sync-branches.yml), which is that branch's root.
# Change one, change them all: they must stay the same.
name: Sync branches

on:
  push:
    branches:
      - main
      - "orbit-*"
  workflow_dispatch: # "Run workflow" on the Actions tab, for a manual sync
  schedule:
    - cron: "*/30 * * * *" # a safety net, in case a push was missed

# One sync at a time; a push that lands meanwhile waits its turn instead of
# racing it.
concurrency:
  group: sync-branches
  cancel-in-progress: false

permissions:
  contents: write # push main and the app branches

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main, with all history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # git subtree needs the whole history

      - name: Commit as the repo owner
        # Merge commits the sync makes show the owner, like the commits
        # made by hand (no bot and no co-author on them).
        run: |
          git config user.name "jeydweirdough"
          git config user.email "235083533+jeydweirdough@users.noreply.github.com"

      - name: Sync main and the app branches
        run: bash scripts/sync-branches.sh

      - name: Say what to do if it failed
        if: failure()
        run: |
          {
            echo "### The sync stopped"
            echo ""
            echo "Most likely a change pushed to an app branch conflicts with main."
            echo "Fix it on your computer, from main:"
            echo ""
            echo '```bash'
            echo "git switch main && git pull"
            echo "bash scripts/sync-branches.sh   # stops at the conflict"
            echo "# fix the files it names, then: git add -A && git commit"
            echo "git push origin main              # this run starts again by itself"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
