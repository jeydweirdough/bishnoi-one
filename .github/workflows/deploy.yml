# Deploys the apps picked to Vercel production, from a button (decided 2026-10-27):
# Actions -> Deploy -> Run workflow, tick the apps, Run. Nothing deploys by itself:
# pushing still deploys nothing, so Vercel's deployments are only spent when asked.
# "What to redeploy" (what-to-redeploy.yml) says which apps to tick.
#
# They go in the order they depend on each other: the Platform, then the APIs,
# then the one app. Each is built on Vercel; the run's summary shows each one's
# result, its address, and when a build fails, the error lines from Vercel's
# build log with a link to it. An API is also asked /health once it's live.
#
# Needs the same as "What to redeploy": the VERCEL_TOKEN secret (a token that may
# deploy), and the VERCEL_TEAM_ID variable when the projects are in a team.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform API
        type: boolean
        default: false
      crm:
        description: CRM API
        type: boolean
        default: false
      inventory:
        description: Inventory API
        type: boolean
        default: false
      finance:
        description: Finance API
        type: boolean
        default: false
      admin:
        description: Executive Admin API
        type: boolean
        default: false
      one_app:
        description: The one app (screens)
        type: boolean
        default: false

permissions:
  contents: read

# One deployment run at a time; a second waits rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy
        env:
          TZ: Asia/Manila
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PICKED: ${{ toJSON(github.event.inputs) }}
          BY: ${{ github.actor }}
        shell: python
        run: |
          import json, os, re, subprocess, sys, time, urllib.request
          from datetime import datetime

          # input, app, folder, Vercel project, whether it answers /health
          APPS = [
              ("platform", "Platform", "bishnoi-platform/backend", "bishnoione-platform-backend", True),
              ("crm", "CRM", "bishnoi-crm/backend", "bishnoione-crm-backend", True),
              ("inventory", "Inventory", "bishnoi-inventory/backend", "bishnoione-inventory-backend", True),
              ("finance", "Finance", "bishnoi-finance/backend", "bishnoione-finance-backend", True),
              ("admin", "Executive Admin", "bishnoi-admin/backend", "bishnoi-one-admin-backend", True),
              ("one_app", "The one app (screens)", "bishnoi-one-app/frontend", "bishnoi-one-app", False),
          ]
          token, team = os.environ.get("VERCEL_TOKEN"), os.environ.get("VERCEL_TEAM_ID")
          picked = {k for k, v in json.loads(os.environ["PICKED"]).items() if str(v).lower() == "true"}
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")

          def say(text=""):
              print(text)
              summary.write(text + "\n")
              summary.flush()

          def vercel_api(path):
              url = f"https://api.vercel.com{path}" + (f"{'&' if '?' in path else '?'}teamId={team}" if team else "")
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  return {"error": str(e)}

          def build_errors(deployment_id):
              """The lines of Vercel's build log that say what went wrong (the last 40 lines if none do)."""
              events = vercel_api(f"/v3/deployments/{deployment_id}/events?builds=1&limit=-1")
              lines = [str((e.get("payload") or e).get("text") or "") for e in events] if isinstance(events, list) else []
              lines = [l.rstrip() for l in lines if l and l.strip()]
              bad = [l for l in lines if re.search(r"error|failed|traceback|exception|cannot|not found|exited with", l, re.I)]
              return (bad or lines)[-40:]

          head = subprocess.run(["git", "log", "-1", "--format=%h: %s"], capture_output=True, text=True).stdout.strip()[:100]
          say("## Deploy")
          say()
          say(f"Run by **{os.environ['BY']}** on {datetime.now():%Y-%m-%d %H:%M} (Manila time), at {head}")
          say()
          if not token:
              say("The `VERCEL_TOKEN` secret isn't set, so nothing can be deployed (see the top of this workflow).")
              sys.exit(1)
          todo = [a for a in APPS if a[0] in picked]
          if not todo:
              say("No app was ticked: nothing deployed.")
              sys.exit(0)

          scope = ["--scope", team] if team else []
          results, failed = [], False
          for key, name, folder, project, has_health in todo:
              started = time.time()
              info = vercel_api(f"/v9/projects/{project}")
              if "id" not in info:
                  results.append((name, "❌ Not deployed", f"Vercel has no project `{project}` ({info.get('error', 'not found')})", None))
                  failed = True
                  continue
              # A project with a Root Directory is deployed from the repository's top; otherwise from its folder.
              where = "." if info.get("rootDirectory") else folder
              subprocess.run(["rm", "-rf", os.path.join(where, ".vercel")])
              link = subprocess.run(["vercel", "link", "--yes", "--project", project, "--token", token, *scope], cwd=where, capture_output=True, text=True)
              if link.returncode:
                  results.append((name, "❌ Not deployed", "Couldn't link to the project: " + (link.stderr.strip().splitlines() or ["no reason given"])[-1], None))
                  failed = True
                  continue
              run = subprocess.run(["vercel", "deploy", "--prod", "--yes", "--token", token, *scope], cwd=where, capture_output=True, text=True)
              # The deployment's own address, from what the CLI printed (on a failure, it may be only in its messages).
              found = re.search(r"https://[\w.-]+\.vercel\.app", run.stdout) or re.search(r"https://[\w.-]+\.vercel\.app", run.stderr)
              url = found.group(0) if found else None
              took = f"{int(time.time() - started) // 60}m {int(time.time() - started) % 60}s"
              d = vercel_api(f"/v13/deployments/{url.removeprefix('https://')}") if url else {}
              inspect = d.get("inspectorUrl") or url
              if run.returncode or d.get("readyState") == "ERROR":
                  errors = build_errors(d["id"]) if d.get("id") else []
                  errors = errors or [l for l in run.stderr.strip().splitlines() if l.strip()][-20:]
                  results.append((name, f"❌ Failed after {took}", f"[Vercel's log]({inspect})" if inspect else "", errors))
                  failed = True
                  continue
              # Live: an API should answer /health at its production address.
              note = f"[Deployment]({inspect})"
              alias = (d.get("alias") or [None])[0]
              if has_health and alias:
                  health = None
                  for _ in range(3):
                      try:
                          with urllib.request.urlopen(f"https://{alias}/health", timeout=20) as r:
                              health = r.status
                              break
                      except Exception as e:
                          health = getattr(e, "code", None) or type(e).__name__
                          time.sleep(5)
                  if health == 200:
                      note += f" · `{alias}/health` answers"
                  else:
                      results.append((name, f"⚠️ Deployed in {took}, but not answering", f"{note} · `{alias}/health` answered {health}: open the deployment's Runtime Logs, or its address, which names the setting to check", None))
                      failed = True
                      continue
              results.append((name, f"✅ Live in {took}", note, None))

          say("| App | Result | Details |")
          say("|---|---|---|")
          for name, result, detail, _ in results:
              say(f"| **{name}** | {result} | {detail} |")
          for name, _, _, errors in results:
              if errors:
                  say()
                  say(f"### {name}: what went wrong")
                  say()
                  say("```")
                  for line in errors:
                      say(line[:300])
                  say("```")
          sys.exit(1 if failed else 0)
