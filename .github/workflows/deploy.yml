# Puts the apps you tick on Vercel, only when you ask:
# Actions > Deploy > Run workflow, tick the apps, pick screens and/or API.
#
# The Platform goes first (every other app checks companies and sign-in there);
# the rest follow once it's done, side by side. An app whose Platform deploy
# failed in the same run isn't deployed. For each app it checks first that
# everything is set up (the Vercel token, its Vercel projects, their settings,
# the apps it needs online) and stops with what to do next when something
# isn't; then tests, deploys the API, then the screens, and checks each
# answers. The steps are in deploy-app.yml; what each app needs is under
# "apps" in .github/deploy.json.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: boolean
        default: false
      crm:
        description: "CRM"
        type: boolean
        default: false
      inventory:
        description: "Inventory"
        type: boolean
        default: false
      admin:
        description: "Executive Admin"
        type: boolean
        default: false
      finance:
        description: "Finance"
        type: boolean
        default: false
      pharmacy:
        description: "Pharmacy"
        type: boolean
        default: false
      in_licensing:
        description: "In-Licensing"
        type: boolean
        default: false
      regulatory:
        description: "Regulatory"
        type: boolean
        default: false
      part:
        description: "What to deploy of each ticked app"
        type: choice
        options:
          - screens and API
          - API only
          - screens only
        default: screens and API
      run_tests:
        description: "Run each API's tests first (a failure stops that app)"
        type: boolean
        default: true

# One deploy run at a time; a second waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # the refs/deployed/<project> markers

jobs:
  platform:
    if: ${{ inputs.platform }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-platform
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  crm:
    needs: platform
    if: ${{ inputs.crm && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-crm
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  inventory:
    needs: platform
    if: ${{ inputs.inventory && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-inventory
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  admin:
    needs: platform
    if: ${{ inputs.admin && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-admin
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  finance:
    needs: platform
    if: ${{ inputs.finance && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-finance
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  pharmacy:
    needs: platform
    if: ${{ inputs.pharmacy && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-pharmacy
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  in_licensing:
    needs: platform
    if: ${{ inputs.in_licensing && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-in-licensing
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit

  regulatory:
    needs: platform
    if: ${{ inputs.regulatory && !cancelled() && needs.platform.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: bishnoi-regulatory
      part: ${{ inputs.part }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit
