# Checks every pull request into main before it is merged.
#
# For each app folder (bishnoi-*) it checks that:
# - the name is bishnoi-<name>: small letters, digits and dashes
# - it has backend/, .gitignore and README.md, and no frontend/: every
#   module's screens are in the one app, bishnoi-one-app (decided 2026-10-23;
#   the app frontends were removed 2026-10-24)
# - no secrets (.env, .env.local, keys) or local data (.data/) are committed
#
# Everyone works on main: the per-app branches and the Sync branches action
# were retired on 2026-10-24.
name: Check apps

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check each app folder
        run: |
          problems=0
          fail() { echo "::error::$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; problems=$((problems + 1)); }

          echo "### Checking the app folders" >> "$GITHUB_STEP_SUMMARY"
          for dir in bishnoi-*/; do
            [ -d "$dir" ] || continue
            app="${dir%/}"
            if ! [[ "$app" =~ ^bishnoi-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              fail "$app: name it bishnoi-<name>, in small letters, digits and dashes (e.g. bishnoi-hr)"
            fi
            # The one app (decided 2026-10-23): every module's screens, no API.
            if [ "$app" = "bishnoi-one-app" ]; then
              [ -d "$app/frontend" ] || fail "$app: the frontend/ folder is missing"
              [ -f "$app/README.md" ] || fail "$app: README.md is missing"
              continue
            fi
            [ -d "$app/backend" ] || fail "$app: the backend/ folder is missing"
            [ ! -d "$app/frontend" ] || fail "$app: screens go in the one app (bishnoi-one-app/frontend), not $app/frontend"
            for file in .gitignore README.md; do
              [ -f "$app/$file" ] || fail "$app: $file is missing (copy it from another app and adjust it)"
            done
          done

          secrets="$(git ls-files | grep -E '(^|/)(\.env(\.[^/]*)?|[^/]*\.(pem|key))$|(^|/)\.data/' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$secrets" ]; then
            while read -r f; do fail "$f: secrets and local data must not be committed"; done <<< "$secrets"
          fi

          if [ "$problems" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Fix these on your branch, then push again. This check runs again by itself." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All app folders look right." >> "$GITHUB_STEP_SUMMARY"
