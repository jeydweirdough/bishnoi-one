<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>You're offline · Bishnoi One</title>
<link rel="icon" href="/brand/app-192.png">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f5f5; color: #141414;
         font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; margin: 1.5rem; padding: 1.75rem; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0.75rem 0 0.5rem; }
  p { margin: 0 0 1.25rem; color: #3d3d3d; line-height: 1.5; font-size: 0.95rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  a, button { min-height: 44px; padding: 0 1.1rem; border-radius: 10px; font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer;
              display: inline-flex; align-items: center; text-decoration: none; }
  button { background: #141414; color: #fff; border: 0; }
  a { background: #fff; color: #141414; border: 1px solid #d4d4d4; }
</style>
</head>
<body>
<main>
  <img src="/brand/app-192.png" alt="">
  <h1>You're offline</h1>
  <p>Your visits and route are kept on this phone and will be sent when you're back online.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/crm/visits/new">Log a visit</a>
  </div>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
